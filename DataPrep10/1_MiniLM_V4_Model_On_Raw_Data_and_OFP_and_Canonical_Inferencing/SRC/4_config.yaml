# Centralized Configuration file for MiniLM Phishing URL Detection Pipeline

reproducibility:
  seed: 42

data_paths:
  train_csv: "RESULTS_&_MODELS/2_preprocess_urls_output/raw_orig_train.csv"
  val_csv: "RESULTS_&_MODELS/2_preprocess_urls_output/raw_orig_val.csv"
  test_csv: "RESULTS_&_MODELS/2_preprocess_urls_output/raw_orig_test.csv"
  save_root: "RESULTS_&_MODELS/3_saved_models/MiniLM_raw_orig4"

model:
  name: "microsoft/MiniLM-L12-H384-uncased"
  max_len: 128
  num_classes: 2
  dropout: 0.15
  classifier_dims: [384, 512, 256, 128, 64]
  use_custom_tokenizer_byte-level_BPE: true
  use_custom_tokenizer_SentencePiece_Unigram_BPE: false
  custom_tokenizer_vocab_size: 50000
  custom_tokenizer_path: "RESULTS_&_MODELS/custom_bpe_tokenizer.json"

training:
  batch_size: 128
  num_epochs: 3
  weight_decay: 0.01
  patience: 3
  grad_accum_steps: 4
  grad_clip_norm: 1.0

learning_rate:
  lr: 0.0001 # 1e-4
  warmup_ratio: 0.03
  min_ratio: 0.001

lora:
  r: 32
  alpha: 64
  dropout: 0.05
  target_modules: ["query", "key", "value", "dense", "output.dense"]

loss:
  focal_gamma_pos: 2.0
  focal_gamma_neg: 4.0
  focal_alpha: [0.28, 0.72]
  label_smoothing: 0.05

class_balancing:
  use_stratified_kfold: false
  kfold_splits: 5
  use_weighted_sampling: false

optimization:
  pruning_ratio: 0.0
  use_amp: true

export:
  export_onnx: true
  export_quantized: true
  onnx_opset: 18

mlflow:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "PhishURL-Detection-MiniLM"
  run_name: "MiniLM-V4-Production-Pipeline"
  register_model: true
  model_name: "PhishURL-MiniLM-Classifier"

kpi_targets:
  target_accuracy: 0.98
  target_precision: 0.95
  target_recall: 0.95
  max_fnr: 0.10
  max_fpr: 0.01
  max_model_size_mb: 40.0

hardware:
  device: "auto"  # Set to "cuda" or "cpu" or "auto"
  num_workers: 0
  pin_memory: false
